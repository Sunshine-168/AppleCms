services:
  web:
    build: .
    container_name: maccms10-web
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: maccms10-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-name-resolve
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: maccms123
      MYSQL_DATABASE: maccms10
      MYSQL_USER: maccms
      MYSQL_PASSWORD: maccms123
    volumes:
      - maccms10_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmaccms123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  maccms10_mysql:
